[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storylens"
version = "0.1.0"
description = "Subtitle-first story understanding (evidence -> facts -> structure -> views) and automatic recaps for films and series in any language."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.70",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pysubs2>=1.6",
  "numpy>=1.24",
]

[project.optional-dependencies]
# neural narration voice (Kokoro, ~350 MB model downloaded on first use) + Silero VAD for subtitle re-sync
voice = ["kokoro-onnx>=0.4", "onnxruntime>=1.17", "soundfile>=0.12"]
# offline system voice fallback (SAPI on Windows, NSSpeech on macOS, espeak on Linux)
system-voice = ["pyttsx3>=2.90"]
dev = ["pytest>=7", "httpx>=0.27"]
all = ["storylens[voice,system-voice,dev]"]

[project.scripts]
storylens = "storylens.cli:main"

[tool.setuptools.packages.find]
include = ["storylens*"]

[tool.setuptools.package-data]
storylens = ["static/*", "samples/*"]
